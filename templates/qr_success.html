 <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generate QR for Aaryas Hotel</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Special+Elite&display=swap" rel="stylesheet">

    <style>
        body {
            background: #14100C;
            font-family: 'Special Elite', monospace;
            color: #F2EFE4;
        }
        .navbar { background: #1B2A22 !important; }
        .navbar a { font-family: 'Caveat', cursive; font-size: 22px !important; color: #E8C468 !important; }

        .qr-frame {
            background: linear-gradient(155deg, #6B4A31, #4E3521);
            padding: 14px;
            max-width: 460px;
            margin: 60px auto;
            box-shadow: 0 24px 50px -18px rgba(0,0,0,0.7);
        }
        .qr-board {
            background: #23342A;
            padding: 34px 30px;
            border-radius: 2px;
            text-align: center;
        }
        .qr-board h1 {
            font-family: 'Caveat', cursive;
            font-weight: 700;
            font-size: 32px;
            color: #F2EFE4;
            transform: rotate(-1deg);
            margin-bottom: 20px;
        }
        .qr-card-wrap { position: relative; display: inline-block; margin-bottom: 18px; }
        .qr-tape {
            position: absolute;
            top: -10px; left: 50%;
            transform: translateX(-50%) rotate(-3deg);
            width: 60px; height: 20px;
            background: rgba(232,196,104,0.55);
            border: 1px solid rgba(232,196,104,0.3);
        }
        .qr-board img {
            background: #F2EFE4;
            padding: 14px;
            width: 180px; height: 180px;
            transform: rotate(1.5deg);
            box-shadow: 0 14px 24px -10px rgba(0,0,0,0.6);
        }
        .qr-note {
            font-family: 'Caveat', cursive;
            font-size: 17px;
            color: #C9C6B8;
            margin: 4px 0 22px;
        }
        .qr-actions a {
            padding: 10px 16px;
            font-family: 'Special Elite', monospace;
            font-size: 11.5px;
            text-decoration: none;
            border: 1.5px solid #C9C6B8;
            color: #F2EFE4;
        }
        .qr-actions a.primary {
            background: #E8C468;
            border-color: #E8C468;
            color: #1B2A22;
        }
        .qr-thanks {
            font-family: 'Caveat', cursive;
            font-size: 20px;
            color: #C9C6B8;
            margin-top: 26px;
        }
    </style>
</head>

<body>
    <nav class="navbar navbar-expand-lg">
        <div class="container">
            <a href="">Generate QR Code</a>
        </div>
    </nav>

    <div class="qr-frame">
        <div class="qr-board">
            <h1>{{ restaurant_name }}</h1>

            <div class="qr-card-wrap">
                <div class="qr-tape"></div>
                <img src="{{ qr_url }}" alt="QR Code">
            </div>

            <p class="qr-note">pinned up — scan for the menu</p>

            <div class="qr-actions d-flex justify-content-center gap-2">
                <a href="{{ qr_url }}" class="primary" download>Download</a>
                <a href="{% url 'generate_qr_code' %}">Back to Board</a>
            </div>

            <h3 class="qr-thanks">Thank you for Using our QR Code Generator</h3>
        </div>
    </div>
</body>
</html>
